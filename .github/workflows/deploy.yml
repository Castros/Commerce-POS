name: Deploy

on:
  push:
    branches: [Main]

jobs:
  ci:
    name: Verify before deploy
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/commerce-pos

            git fetch origin Main
            git reset --hard origin/Main

            # Run migrations before restarting
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api node src/db/migrate.js

            # Rebuild and restart (--build picks up code changes)
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

            # Remove dangling images to reclaim disk
            docker image prune -f
