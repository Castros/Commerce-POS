name: Deploy

on:
  push:
    branches: [Main]

jobs:
  ci:
    name: Verify before deploy
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/commerce-pos

            git fetch origin Main
            git reset --hard origin/Main

            # Refresh .env.prod from current GitHub Secrets
            cat > .env.prod << 'ENVEOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            COMMERCE_API_TOKEN=${{ secrets.COMMERCE_API_TOKEN }}
            CORS_ORIGINS=https://pos.jerrycastro.dev
            APP_URL=https://pos.jerrycastro.dev
            DISABLE_DEMO_SEED=true
            EMAIL_FROM=Commerce POS <noreply@notify.fransolution.net>
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            ENVEOF

            # Run migrations before restarting
            docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api node src/db/migrate.js

            # Rebuild and restart
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

            # Reclaim disk space
            docker image prune -f
