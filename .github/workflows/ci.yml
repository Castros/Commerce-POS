name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  api-check:
    name: API syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Syntax check all JS files
        working-directory: api
        run: |
          for f in $(find src test -name '*.js'); do
            node --check "$f" || exit 1
          done

  web-build:
    name: Web build (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js
        working-directory: web
        run: npm run build
        env:
          NODE_ENV: production
