services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce_pos}
      POSTGRES_USER: ${POSTGRES_USER:-commerce_pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce_pos_dev_password}
    ports:
      - "5434:5432"
    volumes:
      - commerce_pos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commerce_pos} -d ${POSTGRES_DB:-commerce_pos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    command: npm run dev
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://commerce_pos:commerce_pos_dev_password@db:5432/commerce_pos}
      API_PORT: ${API_PORT:-4100}
      NODE_ENV: development
      SPELLING_APP_API_URL: ${SPELLING_APP_API_URL:-http://host.docker.internal:4000}
      SPELLING_APP_SERVICE_TOKEN: ${SPELLING_APP_SERVICE_TOKEN:-}
      COMMERCE_API_TOKEN: ${COMMERCE_API_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3100}
      DISABLE_DEMO_SEED: ${DISABLE_DEMO_SEED:-false}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-change-in-prod}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3100}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${API_PORT:-4100}:4100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    command: npm run dev -- -H 0.0.0.0
    restart: on-failure
    environment:
      API_URL: http://api:4100
      PORT: ${WEB_PORT:-3100}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      NODE_OPTIONS: "--max-old-space-size=8192"
    ports:
      - "${WEB_PORT:-3100}:3100"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  commerce_pos_postgres:
