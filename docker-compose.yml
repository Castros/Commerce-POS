services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-commerce_pos}
      POSTGRES_USER: ${POSTGRES_USER:-commerce_pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce_pos_dev_password}
    ports:
      - "5434:5432"
    volumes:
      - commerce_pos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-commerce_pos} -d ${POSTGRES_DB:-commerce_pos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://commerce_pos:commerce_pos_dev_password@db:5432/commerce_pos}
      API_PORT: ${API_PORT:-4100}
      NODE_ENV: development
    ports:
      - "${API_PORT:-4100}:4100"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
    environment:
      API_URL: http://api:4100
      PORT: ${WEB_PORT:-3100}
    ports:
      - "${WEB_PORT:-3100}:3100"
    depends_on:
      - api

volumes:
  commerce_pos_postgres:

